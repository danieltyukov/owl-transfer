[workspace]
members = ["crates/core", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/danieltyukov/owl-transfer"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Debug info for the dependency tree (Tauri, WebKit bindings, tokio, rustls)
# is most of a 13 GB target directory and nobody steps through it. Our own
# crates keep full debug info; dependencies keep none.
[profile.dev.package."*"]
debug = false

# Tests transfer tens of megabytes; an unoptimised blake3 makes them slow for
# no reason.
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
